org.gradle.caching=false
org.gradle.parallel=true
org.gradle.configureondemand=true

# Cached Forge merged output can restore resources without compiled classes.
# Keep fresh task execution/configuration so release JARs always contain their Java classes.
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true
